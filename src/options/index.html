<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedSense Options</title>
  </head>
  <body>
    <h1>FeedSense</h1>
    <label>
      Global mode
      <select id="globalMode">
        <option value="ON">ON</option>
        <option value="OFF">OFF</option>
      </select>
    </label>
    <label>
      Hide sponsored
      <input id="hideSponsored" type="checkbox" />
    </label>
    <label>
      Hide Follow-marked (not subscribed)
      <input id="hideFollowMarked" type="checkbox" />
    </label>
    <button id="save">Save</button>
    <script type="module" src="./options.js"></script>
  </body>
</html>
